version: '3.3'

services:
  postgres:
    image: postgis/postgis:13-3.1
    networks:
      - njord
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: s57server
    volumes:
      - /home/loic/docker-data/Development/njord-postgres:/var/lib/postgresql/data

  pgbouncer:
    image: ghcr.io/cloudnative-pg/pgbouncer:latest
    networks:
      - njord
    ports:
      - "5432:5432"
    volumes:
      - ./chart_server_db/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./chart_server_db/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      - postgres

  njord:
    image: ghcr.io/amnesic/njord-chart-server:1.2-SNAPSHOT
    networks:
      - njord
    ports:
      - "9001:9000"
    environment:
      CHART_SERVER_OPTS: >-
        {
          "pgConnectionInfo": "postgresql://admin@pgbouncer:5432/s57server",
          "host": "0.0.0.0",
          "port": 9000,
          "externalScheme": "https",
          "externalHostName": "caas-mvt.geogarage.com",
          "externalPort": 443,
          "adminUser": "admin",
          "adminPass": "admin",
          "adminKey": "changeme"
        }
    depends_on:
      - pgbouncer

networks:
  njord:

